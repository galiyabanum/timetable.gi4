<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Полное расписание — Гимназия-интернат №4</title><style>
:root{--green:#0c5f2a;--dark:#084820;--soft:#edf6f0;--bg:#f7f7f4;--ink:#202923;--muted:#687269;--line:#d9e1db}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(420px,100%);padding:30px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 18px 55px rgba(12,95,42,.12)}.school{margin:0 0 9px;color:var(--green);font-size:13px;font-weight:850;text-transform:uppercase;letter-spacing:.05em}.login h1{margin:0 0 9px;font-size:31px}.note{margin:0 0 20px;color:var(--muted);line-height:1.5}.password{display:flex;gap:8px}.password input{min-width:0;flex:1;padding:11px;border:1px solid var(--line);border-radius:10px}.button{border:0;border-radius:10px;padding:11px 15px;background:#e8ede9;color:var(--ink);font-weight:780;cursor:pointer;text-decoration:none}.button.primary{background:var(--green);color:#fff}.error{min-height:20px;margin-top:10px;color:#9e352f;font-size:13px}.app{max-width:1600px;margin:auto;padding:30px 22px 60px}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;margin-bottom:24px;padding:14px 0;background:rgba(247,247,244,.96);border-bottom:1px solid var(--line)}.top h1{margin:0;font-size:clamp(25px,3vw,40px)}.top .actions{display:flex;gap:8px;margin-left:auto}.class-nav{display:flex;gap:6px;overflow:auto;margin-bottom:22px;padding:5px;border-radius:12px;background:#e5ece7}.class-nav a{flex:none;padding:8px 11px;border-radius:8px;color:var(--green);font-size:12px;font-weight:800;text-decoration:none}.class-nav a:hover{background:#fff}.schedules{display:grid;gap:34px}.class-block{scroll-margin-top:100px;padding-top:8px;border-top:3px solid var(--green)}.class-block:first-child{border-top:0}.class-block h2{margin:0 0 10px;font-size:24px}.table-wrap{overflow:auto}.week{width:100%;min-width:1000px;border-collapse:separate;border-spacing:5px;table-layout:fixed}.week th{height:40px;padding:7px;border-radius:8px;background:var(--green);color:#fff;font-size:12px}.week .num{width:42px;text-align:center}.week td{height:76px;padding:7px;vertical-align:top;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:10px}.week td:nth-child(2),.week td:nth-child(4),.week td:nth-child(6){background:var(--soft)}.entry+.entry{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}.entry b,.entry span{display:block}.entry span{margin-top:2px;color:var(--muted)}.empty{color:#a0a8a1}@media(max-width:700px){.app{padding:16px 7px 40px}.top{align-items:flex-start;flex-wrap:wrap}.top .actions{width:100%;margin-left:0}.top .actions>*{flex:1;text-align:center}.class-block h2{padding-left:7px}}
@media print{@page{size:A4 landscape;margin:6mm}body{background:#fff}.top,.class-nav{display:none!important}.app{max-width:none;padding:0}.schedules{display:block}.class-block{break-after:page;page-break-after:always;border:0;padding:0}.class-block:last-child{break-after:auto;page-break-after:auto}.class-block h2{margin:0 0 2mm;font-size:13pt}.table-wrap{overflow:visible}.week{width:100%;min-width:0;border-spacing:1mm .7mm}.week th{height:6mm;padding:.6mm;border:1px solid #000;border-radius:0;background:#fff!important;color:#000;font-size:6.5pt}.week .num{width:7mm}.week td,.week td:nth-child(n){height:auto;padding:.7mm;border:1px solid #000;border-radius:0;background:#fff;font-size:5.2pt;line-height:1.1}.entry+.entry{margin-top:.5mm;padding-top:.5mm;border-top:1px dotted #000}.entry span{margin-top:.3mm;color:#000}}
</style></head><body><section id="login" class="login"><form id="loginForm" class="login-card"><p class="school">Гимназия-интернат №4</p><h1>Полное расписание</h1><p class="note">Введите пароль администратора для просмотра расписания всей гимназии.</p><div class="password"><input id="password" type="password" autocomplete="current-password" required placeholder="Пароль"><button class="button primary">Войти</button></div><div id="error" class="error"></div></form></section><main id="app" class="app hidden"><header class="top"><div><p class="school">Гимназия-интернат №4</p><h1>Расписание всех классов</h1></div><div class="actions"><a class="button" href="admin.html">В админку</a><button id="printButton" class="button primary">Распечатать</button></div></header><nav id="classNav" class="class-nav"></nav><div id="schedules" class="schedules"></div></main><script>
const SUPABASE_URL='https://xcvmtxqcwhkwjxmacmcx.supabase.co',SUPABASE_KEY='sb_publishable_pvw8EXJgOXbT4_lexvQ1Eg_NM6-PXCj',ADMIN_EMAIL='admin@gi4.kzn',DAYS=['Пн','Вт','Ср','Чт','Пт','Сб'],FULL={Пн:'Понедельник',Вт:'Вторник',Ср:'Среда',Чт:'Четверг',Пт:'Пятница',Сб:'Суббота'};let token='';const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),clean=v=>String(v||'').replace(/\s+/g,'');
function weekHtml(data,className){const own=data.filter(x=>x['Класс']===className),max=Math.max(1,...own.map(x=>+x['Урок']||0));let html='<thead><tr><th class="num">№</th>'+DAYS.map(d=>'<th>'+FULL[d]+'</th>').join('')+'</tr></thead><tbody>';for(let lesson=1;lesson<=max;lesson++){html+='<tr><th class="num">'+lesson+'</th>'+DAYS.map(day=>{const items=own.filter(x=>x['День']===day&&+x['Урок']===lesson);return '<td>'+(items.length?items.map(x=>'<div class="entry"><b>'+esc(x['Предмет'])+'</b><span>'+esc(x['Учитель'])+'</span><span>'+esc(x['Кабинет']?'каб. '+x['Кабинет']:'кабинет не указан')+'</span></div>').join(''):'<span class="empty">—</span>')+'</td>'}).join('')+'</tr>'}return html+'</tbody>'}
async function loadSchedule(){const response=await fetch(SUPABASE_URL+'/rest/v1/schedule_state?id=eq.1&select=data',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token}});if(!response.ok)throw new Error('Не удалось загрузить расписание.');const rows=await response.json(),data=Array.isArray(rows[0]?.data)?rows[0].data:[];if(!data.length)throw new Error('Расписание ещё не загружено.');const classes=[...new Set(data.map(x=>x['Класс']).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru',{numeric:true}));document.getElementById('classNav').innerHTML=classes.map((c,i)=>'<a href="#class-'+i+'">'+esc(clean(c))+'</a>').join('');document.getElementById('schedules').innerHTML=classes.map((c,i)=>'<section id="class-'+i+'" class="class-block"><h2>Класс '+esc(clean(c))+'</h2><div class="table-wrap"><table class="week">'+weekHtml(data,c)+'</table></div></section>').join('');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden')}
document.getElementById('loginForm').onsubmit=async event=>{event.preventDefault();const error=document.getElementById('error');error.textContent='Проверяем пароль…';try{const response=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:ADMIN_EMAIL,password:document.getElementById('password').value})});if(!response.ok)throw new Error('Неверный пароль.');token=(await response.json()).access_token;sessionStorage.setItem('school-schedule-token',token);await loadSchedule();error.textContent=''}catch(e){error.textContent=e.message}};document.getElementById('printButton').onclick=()=>window.print();(async()=>{token=sessionStorage.getItem('school-schedule-token')||'';if(!token)return;try{const check=await fetch(SUPABASE_URL+'/auth/v1/user',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token}});if(check.ok)await loadSchedule();else sessionStorage.removeItem('school-schedule-token')}catch(e){}})();
</script></body></html>
